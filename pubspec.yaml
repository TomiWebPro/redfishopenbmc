name: redfishopenbmc
description: Redfish/OpenBMC multi-system control plane — schema-driven Flutter app. "Everything is discovered, nothing is assumed."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  dio: ^5.7.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.8.0
  lints: ^5.1.1
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
