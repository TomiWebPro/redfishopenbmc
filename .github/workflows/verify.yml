name: verify

# Issue #010 Testing gate + #009 remote-KVM coverage: keep main shippable on
# every push/PR. Runs the same three checks the runbook requires before a push:
# a clean analyzer, a fully green test suite with lcov, and the coverage gates
# enforced by tool/coverage_gate.dart (overall >=75%, redfish+power+sensors
# >=80%, and remote-KVM >=75%; text output here, --json available for CI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (0 issues required)
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce coverage gates (>=75% overall, >=80% scoped, >=75% KVM)
        run: dart run tool/coverage_gate.dart coverage/lcov.info

      - name: Enforce large/binary asset manifest policy
        run: dart run tool/asset_guard.dart

      - name: Enforce unattended live-BMC safety gate
        run: dart run tool/unattended_guard.dart
